<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#0B1120"/>
  <text x="32" y="42" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="22" font-weight="700">ISA-101 P&amp;ID COMPONENT LIBRARY — SECTION 700 (T-761 LOOP)</text>
  <text x="32" y="66" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Import into Figma -&gt; Select each group -&gt; Create Component Set (Variants) for Two-Way Sync with GitHub</text>

  <!-- Symbol 1: Distillation Tower T-761 -->
  <g id="SYM_Distillation_Tower" transform="translate(50, 110)">
    <rect x="0" y="0" width="160" height="320" rx="8" fill="#111827" stroke="#334155"/>
    <text x="80" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Tower / Column</text>
    <rect x="55" y="45" width="50" height="220" rx="25" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <line x1="57" y1="85" x2="103" y2="85" stroke="#64748B" stroke-dasharray="4 3"/>
    <line x1="57" y1="120" x2="103" y2="120" stroke="#64748B" stroke-dasharray="4 3"/>
    <line x1="57" y1="155" x2="103" y2="155" stroke="#38BDF8" stroke-width="1.5"/>
    <line x1="57" y1="190" x2="103" y2="190" stroke="#64748B" stroke-dasharray="4 3"/>
    <line x1="57" y1="225" x2="103" y2="225" stroke="#64748B" stroke-dasharray="4 3"/>
    <text x="80" y="295" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" text-anchor="middle">T-761</text>
  </g>

  <!-- Symbol 2: Horizontal Drum -->
  <g id="SYM_Horizontal_Drum" transform="translate(240, 110)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#111827" stroke="#334155"/>
    <text x="110" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Horizontal Drum + Boot</text>
    <rect x="35" y="48" width="150" height="54" rx="27" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="135" y="102" width="18" height="22" rx="3" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
    <text x="110" y="80" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">D-762 / D-763</text>
  </g>

  <!-- Symbol 3: Vertical Drum -->
  <g id="SYM_Vertical_Drum" transform="translate(240, 280)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#111827" stroke="#334155"/>
    <text x="110" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Vertical Drum</text>
    <rect x="82" y="38" width="56" height="86" rx="22" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="110" y="86" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">D-761</text>
  </g>

  <!-- Symbol 4: Heat Exchanger / Reboiler / Condenser -->
  <g id="SYM_Heat_Exchanger" transform="translate(490, 110)">
    <rect x="0" y="0" width="210" height="150" rx="8" fill="#111827" stroke="#334155"/>
    <text x="105" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Shell &amp; Tube Exchanger</text>
    <circle cx="105" cy="78" r="30" fill="#1E293B" stroke="#EF4444" stroke-width="2.5"/>
    <polyline points="75,78 92,64 118,92 135,78" fill="none" stroke="#F8FAFC" stroke-width="2"/>
    <text x="105" y="130" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">E-761..E-765</text>
  </g>

  <!-- Symbol 5: Centrifugal Pump Variants -->
  <g id="SYM_Centrifugal_Pump" transform="translate(490, 280)">
    <rect x="0" y="0" width="210" height="150" rx="8" fill="#111827" stroke="#334155"/>
    <text x="105" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Centrifugal Pump (Run/Stop)</text>
    <!-- Running -->
    <circle cx="65" cy="78" r="20" fill="#14532D" stroke="#22C55E" stroke-width="2.5"/>
    <polygon points="55,98 75,98 65,86" fill="#22C55E"/>
    <text x="65" y="122" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">RUN</text>
    <!-- Stopped -->
    <circle cx="145" cy="78" r="20" fill="#450A0A" stroke="#EF4444" stroke-width="2.5"/>
    <polygon points="135,98 155,98 145,86" fill="#EF4444"/>
    <text x="145" y="122" fill="#EF4444" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">STOP</text>
  </g>

  <!-- Symbol 6: Control Valve & Manual Block Valves -->
  <g id="SYM_Valves_Kit" transform="translate(730, 110)">
    <rect x="0" y="0" width="420" height="320" rx="8" fill="#111827" stroke="#334155"/>
    <text x="210" y="24" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">Control Valve &amp; Manual Block Valve Variants</text>

    <!-- Control Valve -->
    <g transform="translate(55, 65)">
      <line x1="25" y1="15" x2="25" y2="35" stroke="#F8FAFC" stroke-width="2"/>
      <path d="M10,15 A15,12 0 0,1 40,15 Z" fill="#38BDF8" stroke="#F8FAFC" stroke-width="1.5"/>
      <polygon points="8,27 25,35 8,43" fill="#22C55E" stroke="#F8FAFC" stroke-width="1.5"/>
      <polygon points="42,27 25,35 42,43" fill="#22C55E" stroke="#F8FAFC" stroke-width="1.5"/>
      <text x="25" y="65" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">FV / LV / PV</text>
    </g>

    <!-- Manual Valve Open -->
    <g transform="translate(185, 65)">
      <polygon points="8,27 25,35 8,43" fill="#22C55E" stroke="#F8FAFC" stroke-width="1.5"/>
      <polygon points="42,27 25,35 42,43" fill="#22C55E" stroke="#F8FAFC" stroke-width="1.5"/>
      <text x="25" y="65" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">OPEN (V#)</text>
    </g>

    <!-- Manual Valve Closed -->
    <g transform="translate(305, 65)">
      <polygon points="8,27 25,35 8,43" fill="#EF4444" stroke="#F8FAFC" stroke-width="1.5"/>
      <polygon points="42,27 25,35 42,43" fill="#EF4444" stroke="#F8FAFC" stroke-width="1.5"/>
      <text x="25" y="65" fill="#EF4444" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">CLOSE (V#)</text>
    </g>

    <!-- DCS Faceplate Tag -->
    <g transform="translate(55, 175)">
      <rect x="0" y="0" width="140" height="62" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="10" y="20" fill="#38BDF8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">TI-792</text>
      <text x="130" y="20" fill="#22C55E" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="end">NORM</text>
      <text x="10" y="46" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">158.0 °C</text>
    </g>

    <!-- Locator Beacon -->
    <g transform="translate(245, 175)">
      <circle cx="32" cy="31" r="24" fill="none" stroke="#FACC15" stroke-width="2.5" stroke-dasharray="6 4"/>
      <circle cx="32" cy="31" r="10" fill="none" stroke="#FACC15" stroke-width="2"/>
      <text x="72" y="36" fill="#FACC15" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">Locator Crosshair</text>
    </g>
  </g>
</svg>
